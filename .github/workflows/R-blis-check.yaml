name: BLIS check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  blis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install BLIS & system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblis-dev ghostscript

      - name: Replace R BLAS with BLIS
        run: |
          R_LIB_DIR="$(Rscript -e 'cat(file.path(R.home("lib")))')"
          BLIS_SO="$(find /usr/lib -name "libblis*.so*" | head -n 1)"

          if [ -z "${BLIS_SO}" ]; then
            echo "ERROR: Could not locate BLIS shared library file."
            exit 1
          fi

          echo "Found BLIS at: ${BLIS_SO}"
          echo "Linking to: ${R_LIB_DIR}/libRblas.so"
          sudo ln -sf "${BLIS_SO}" "${R_LIB_DIR}/libRblas.so"

      - name: Verify BLIS linkage
        run: |
          Rscript -e '
            x <- matrix(rnorm(10000), 100, 100)
            stopifnot(is.matrix(x %*% x), all(is.finite(x %*% x)))
            cat("SUCCESS: Matrix multiplication using BLIS completed.\n")
          '

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=qpdf")'

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blis-check-results
          path: |
            *.tar.gz
            *.Rcheck/
