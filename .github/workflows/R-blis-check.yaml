name: BLIS check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  blis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libreadline-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev \
            libicu-dev \
            libpng-dev \
            libjpeg-dev \
            libcairo2-dev \
            libtiff-dev \
            libblis-serial-dev \
            texinfo \
            pandoc \
            ghostscript

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Download R-devel
        run: |
          git clone --depth 1 https://github.com/r-devel/r-svn.git R-devel
          echo "Revision: 87000" > R-devel/SVN-REVISION
          echo "Last Changed Date: $(date -I)" >> R-devel/SVN-REVISION
          sed -i '/not an svn checkout/s/exit 1/true/' R-devel/Makefile.in

      - name: Configure R with BLIS
        working-directory: R-devel
        run: |
          ./configure \
            --prefix="$HOME/R-devel-blis" \
            --with-blas="-lblis" \
            --with-lapack \
            --with-2025blas \
            --without-x \
            --without-recommended-packages

      - name: Build R
        working-directory: R-devel
        run: |
          make -j"$(nproc)"
          make install

      - name: Verify R & BLIS linkage
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"
          ldd "$HOME/R-devel-blis/lib/R/lib/libRblas.so" | grep -qi blis || {
            echo "ERROR: R's libRblas.so is not linked to BLIS."
            exit 1
          }
          R --vanilla -e '
            x <- matrix(rnorm(10000), 100, 100)
            stopifnot(is.matrix(x %*% x), all(is.finite(x %*% x)))
            cat("SUCCESS: BLAS matrix multiplication with BLIS succeeded.\n")
          '

      - name: Check package
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"
          Rscript -e 'install.packages("rcmdcheck", repos = "https://cloud.r-project.org")'
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--as-cran", "--no-manual"), error_on = "warning")'

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blis-check-results
          path: |
            *.tar.gz
            *.Rcheck/
