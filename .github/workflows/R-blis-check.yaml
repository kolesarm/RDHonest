name: BLIS check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  blis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libreadline-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev \
            libicu-dev \
            libpng-dev \
            libjpeg-dev \
            libcairo2-dev \
            libtiff-dev \
            libblis-serial-dev \
            texinfo \
            texlive \
            texlive-latex-extra \
            texlive-fonts-recommended \
            pandoc

      - name: Show BLIS installation
        run: |
          echo "=== BLIS libraries ==="
          ldconfig -p | grep -i blis || true

          echo
          echo "=== BLIS files ==="
          dpkg -L libblis-serial-dev | grep -E '\.(so|a)$' || true

      - name: Download R-devel
        run: |
          git clone --depth 1 https://github.com/r-devel/r-svn.git R-devel

      - name: Configure R with BLIS
        working-directory: R-devel
        run: |
          ./configure \
            --prefix="$HOME/R-devel-blis" \
            --with-blas="-lblis" \
            --with-lapack \
            --with-2025blas \
            --without-x \
            --without-recommended-packages

      - name: Build R
        working-directory: R-devel
        run: |
          make -j"$(nproc)"
          make install

      - name: Verify R is using BLIS
        shell: bash
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"

          echo "=== R version ==="
          R --version

          echo
          echo "=== R configuration ==="
          R RHOME
          R CMD config BLAS_LIBS
          R CMD config LAPACK_LIBS

          echo
          echo "=== R session information ==="
          R --vanilla -q -e 'sessionInfo()'

          echo
          echo "=== La_library() ==="
          R --vanilla -q -e 'print(La_library())'

          echo
          echo "=== libRblas.so ==="
          ls -l "$HOME/R-devel-blis/lib/R/lib/libRblas.so"

          echo
          echo "=== Dependencies of libRblas.so ==="
          ldd "$HOME/R-devel-blis/lib/R/lib/libRblas.so"

          echo
          echo "=== Verify BLIS ==="

          if ! ldd "$HOME/R-devel-blis/lib/R/lib/libRblas.so" \
              | grep -qi blis; then
            echo "ERROR: R's libRblas.so is not linked to BLIS."
            echo
            echo "Full ldd output:"
            ldd "$HOME/R-devel-blis/lib/R/lib/libRblas.so"
            exit 1
          fi

          echo "SUCCESS: R's BLAS is linked to BLIS."

      - name: Test BLAS from R
        shell: bash
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"

          R --vanilla --slave <<'EOF'
          cat("BLAS/LAPACK library:\n")
          print(La_library())

          cat("\nBLAS test:\n")
          x <- matrix(rnorm(10000), 100, 100)
          y <- matrix(rnorm(10000), 100, 100)
          z <- x %*% y

          stopifnot(
            is.matrix(z),
            all(is.finite(z))
          )

          cat("BLAS matrix multiplication succeeded.\n")
          EOF

      - name: Install R package dependencies
        shell: bash
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"

          Rscript -e '
            install.packages(
              c("remotes", "rcmdcheck"),
              repos = "https://cloud.r-project.org"
            )
          '

          Rscript -e '
            remotes::install_deps(
              dependencies = TRUE,
              upgrade = "never"
            )
          '

      - name: Build package
        shell: bash
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"
          R CMD build .

      - name: Check package
        shell: bash
        run: |
          export PATH="$HOME/R-devel-blis/bin:$PATH"

          PKG=$(ls -t *.tar.gz | head -1)

          R CMD check \
            --as-cran \
            --no-manual \
            "$PKG"

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blis-check-results
          path: |
            *.tar.gz
            *.Rcheck/
